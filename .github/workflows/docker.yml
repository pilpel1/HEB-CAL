name: docker

# Build and push ghcr.io/pilpel1/heb-cal.
# Auth is GITHUB_TOKEN only (permissions.packages: write). No repo secrets.
# A new GHCR package is private until the owner sets it Public once:
# GitHub profile → Packages → heb-cal → Package settings → Change visibility → Public.
# provenance is off so the push does not need id-token or attestations.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION is not semver: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "ghcr.io/pilpel1/heb-cal:${version}"
            echo "ghcr.io/pilpel1/heb-cal:latest"
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "ghcr.io/pilpel1/heb-cal:v${version}"
              if [[ "${GITHUB_REF_NAME}" != "v${version}" && "${GITHUB_REF_NAME}" != "${version}" ]]; then
                echo "ghcr.io/pilpel1/heb-cal:${GITHUB_REF_NAME}"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: "${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}"
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=heb-cal
            org.opencontainers.image.description=Hebrew-Gregorian household calendar
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
