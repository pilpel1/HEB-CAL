{% extends "base.html" %}

{% block title %}רשימת אירועים{% endblock %}

{% block content %}
<!-- הוספת Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>
.search-container {
    position: relative;
}

.search-input-group {
    display: flex;
    border: 1px solid #ced4da;
    border-radius: 0.375rem;
    overflow: hidden;
    background-color: white;
}

.search-input-group input {
    border: none;
    border-radius: 0;
}

.search-input-group input:focus {
    box-shadow: none;
    border-color: transparent;
}

.search-input-group button {
    border: none;
    border-left: 1px solid #ced4da;
    border-radius: 0;
    padding: 0.375rem 0.75rem;
    background-color: white;
}

.search-input-group button:hover {
    background-color: #f8f9fa;
}

.search-input-group button:focus {
    box-shadow: none;
}

/* שאר הסגנונות */
#advancedSearchPanel {
    position: absolute;
    top: 100%;
    right: 0;
    width: 100%;
    z-index: 1000;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    border: 1px solid #ddd;
    background-color: white;
    margin-top: 5px;
}

#advancedSearchPanel .card-body {
    padding: 1rem;
}

#advancedSearchBtn i {
    font-size: 1.1rem;
}

/* אנימציה לפתיחה וסגירה של הפאנל */
#advancedSearchPanel {
    transition: all 0.3s ease-in-out;
    transform-origin: top;
}

#advancedSearchPanel.show {
    transform: scaleY(1);
    opacity: 1;
}

#advancedSearchPanel.hide {
    transform: scaleY(0);
    opacity: 0;
}

/* עיצוב אזור התגיות */
.active-filters {
    margin: 10px 0;
    padding: 0 15px;
    display: none; /* יוצג רק כשיש פילטרים פעילים */
}

.filter-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
}

.filter-chip {
    display: inline-flex;
    align-items: center;
    background-color: #f8f9fa;
    border: 1px solid #dee2e6;
    border-radius: 50px;
    padding: 4px 12px;
    font-size: 0.875rem;
    color: #495057;
    transition: all 0.2s ease;
}

.filter-chip:hover {
    background-color: #e9ecef;
}

.filter-chip .remove-filter {
    margin-right: 8px;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.2s ease;
}

.filter-chip .remove-filter:hover {
    opacity: 1;
}

.edit-search {
    display: inline-flex;
    align-items: center;
    padding: 4px 12px;
    color: #6c757d;
    cursor: pointer;
    transition: color 0.2s ease;
}

.edit-search:hover {
    color: #495057;
}

.edit-search i {
    margin-left: 4px;
}
</style>

<div class="card">
    <div class="card-header">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0">אירועים</h5>
            <div class="search-container" style="width: 300px;">
                <div class="search-input-group">
                    <input type="text" id="searchInput" class="form-control" placeholder="חיפוש אירועים..." />
                    <button class="btn" type="button" id="advancedSearchBtn" title="חיפוש מתקדם">
                        <i class="bi bi-gear-fill"></i>
                    </button>
                </div>
                <div id="advancedSearchPanel" class="card mt-2" style="display: none;">
                    <div class="card-body">
                        <form id="advancedSearchForm">
                            <div class="mb-3">
                                <label class="form-label">חיפוש בשם האירוע</label>
                                <input type="text" class="form-control" id="titleSearch" placeholder="הזן שם אירוע...">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">חיפוש בתיאור</label>
                                <input type="text" class="form-control" id="descriptionSearch" placeholder="הזן טקסט לחיפוש בתיאור...">
                            </div>
                            <div class="row mb-3">
                                <div class="col">
                                    <label class="form-label">מתאריך</label>
                                    <input type="date" class="form-control" id="startDate">
                                </div>
                                <div class="col">
                                    <label class="form-label">עד תאריך</label>
                                    <input type="date" class="form-control" id="endDate">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">סינון לפי זמן</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="timeFilter" id="allEvents" value="all" checked>
                                    <label class="form-check-label" for="allEvents">כל האירועים</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="timeFilter" id="pastEvents" value="past">
                                    <label class="form-check-label" for="pastEvents">אירועים שעברו</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="timeFilter" id="futureEvents" value="future">
                                    <label class="form-check-label" for="futureEvents">אירועים עתידיים</label>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">צבע האירוע</label>
                                <select class="form-control" id="colorSearch">
                                    <option value="">כל הצבעים</option>
                                    <option value="null">ללא צבע</option>
                                    <option value="cyan">ציאן</option>
                                    <option value="yellow">צהוב</option>
                                    <option value="orange">כתום</option>
                                    <option value="green">ירוק</option>
                                </select>
                            </div>
                            <div class="d-flex justify-content-between">
                                <button type="button" class="btn btn-secondary" id="resetAdvancedSearch">איפוס</button>
                                <button type="submit" class="btn btn-primary">חפש</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="active-filters">
        <div class="filter-chips">
            <!-- תגיות יתווספו כאן דינמית -->
        </div>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table events-list-table">
                <thead>
                    <tr>
                        <th>כותרת</th>
                        <th>תאריך לועזי</th>
                        <th>תאריך עברי</th>
                        <th>שעה</th>
                        <th>תיאור</th>
                        <th>פעולות</th>
                    </tr>
                </thead>
                <tbody id="eventsTable">
                    <!-- הנתונים יוכנס כאן דרך JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
let debounceTimeout;
const COLOR_OPACITY = 0.8;  // קבוע גלובלי לרמת השקיפות

document.addEventListener('DOMContentLoaded', function() {
    loadEvents();
    
    const searchInput = document.getElementById('searchInput');
    const advancedSearchBtn = document.getElementById('advancedSearchBtn');
    const advancedSearchPanel = document.getElementById('advancedSearchPanel');
    const advancedSearchForm = document.getElementById('advancedSearchForm');
    const resetAdvancedSearch = document.getElementById('resetAdvancedSearch');
    
    // מאזין לכפתור החיפוש המתקדם
    advancedSearchBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        const panel = document.getElementById('advancedSearchPanel');
        if (panel.style.display === 'none') {
            panel.style.display = 'block';
            setTimeout(() => panel.classList.add('show'), 10);
        } else {
            panel.classList.remove('show');
            setTimeout(() => panel.style.display = 'none', 300);
        }
    });
    
    // מאזין לשינויים בשדה החיפוש הפשוט
    searchInput.addEventListener('input', async function(e) {
        clearTimeout(debounceTimeout);
        
        if (!e.target.value || e.target.value.length === 0) {
            console.log('=== השדה ריק - טוען את כל האירועים ===');
            await loadAllEvents();
            return;
        }
        
        debounceTimeout = setTimeout(() => {
            const searchTerm = e.target.value.trim();
            if (searchTerm) {
                console.log('מחפש:', searchTerm);
                searchEvents(searchTerm);
            }
        }, 300);
    });
    
    // מאזין לטופס החיפוש המתקדם
    advancedSearchForm.addEventListener('submit', function(e) {
        e.preventDefault();
        performAdvancedSearch();
    });
    
    // מאזין לכפתור האיפוס
    resetAdvancedSearch.addEventListener('click', async function() {
        console.log('=== מתחיל תהליך איפוס ===');
        advancedSearchForm.reset();
        
        // ניקוי שדה החיפוש הפשוט גם כן
        searchInput.value = '';
        
        console.log('טופס אופס, טוען את כל האירועים מחדש...');
        await loadAllEvents();
        console.log('טעינת האירועים הושלמה');
        
        // סגירת פאנל החיפוש המתקדם
        const panel = document.getElementById('advancedSearchPanel');
        panel.classList.remove('show');
        setTimeout(() => panel.style.display = 'none', 300);
        console.log('=== תהליך האיפוס הושלם ===');
    });
    
    // מניעת סגירת הפאנל בלחיצה בתוכו
    advancedSearchPanel.addEventListener('click', function(e) {
        e.stopPropagation();
    });
    
    // סגירת הפאנל בלחיצה מחוץ לאזור החיפוש
    document.addEventListener('click', function(e) {
        const searchContainer = document.querySelector('.search-container');
        const panel = document.getElementById('advancedSearchPanel');
        const editButton = e.target.closest('.edit-search');
        
        // אם הלחיצה היא על כפתור העריכה, לא נסגור את הפאנל
        if (editButton) {
            e.stopPropagation();
            return;
        }
        
        if (!searchContainer.contains(e.target) && panel.style.display !== 'none') {
            panel.classList.remove('show');
            setTimeout(() => panel.style.display = 'none', 300);
        }
    });
});

async function loadEvents() {
    console.log('=== מתחיל טעינת כל האירועים ===');
    const tbody = document.getElementById('eventsTable');
    const searchInput = document.getElementById('searchInput');
    console.log('ערך שדה החיפוש בזמן loadEvents:', searchInput.value);
    
    try {
        const response = await fetch('/api/events?t=' + new Date().getTime());
        console.log('קוד תשובה מהשרת:', response.status);
        
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const events = await response.json();
        console.log('התקבלו', events.length, 'אירועים');
        updateTable(events);
        
        return events;  // מחזיר את האירועים למקרה שנצטרך אותם
    } catch (error) {
        console.error('!!! שגיאה בטעינת האירועים !!!', error);
        tbody.innerHTML = '<tr><td colspan="6" class="text-center">שגיאה בטעינת האירועים</td></tr>';
        throw error;  // זורק את השגיאה הלאה
    }
}

function searchEvents(query) {
    console.log('=== מתחיל חיפוש אירועים ===');
    console.log('מחרוזת חיפוש:', query);
    const tbody = document.getElementById('eventsTable');
    
    fetch(`/api/events/search?query=${encodeURIComponent(query)}`)
        .then(response => {
            console.log('קוד תשובה מהשרת בחיפוש:', response.status);
            return response.json();
        })
        .then(events => {
            console.log('נמצאו', events.length, 'תוצאות');
            updateTable(events);
        })
        .catch(error => {
            console.error('שגיאה בחיפוש:', error);
            tbody.innerHTML = '<tr><td colspan="6" class="text-center">שגיאה בחיפוש</td></tr>';
        });
}

function convertToRGBA(color, alpha = COLOR_OPACITY) {  // שימוש בקבוע כברירת מחדל
    try {
        // אם זה שם צבע באנגלית, נמיר אותו ל-RGB
        if (!/^#/.test(color)) {
            const colorMap = {
                'cyan': [0, 255, 255],
                'red': [255, 0, 0],
                'blue': [0, 0, 255],
                'green': [0, 128, 0],
                'yellow': [255, 255, 0],
                'purple': [128, 0, 128],
                'orange': [255, 165, 0]
            };
            
            const rgb = colorMap[color.toLowerCase()];
            if (rgb) {
                return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${alpha})`;
            }
            
            console.error('צבע לא נתמך:', color);
            return '';
        }
        
        // אם זה צבע HEX, נמשיך כמו קודם
        let hex = color.replace('#', '');
        
        // בדיקה שהצבע תקין
        if (!/^[0-9A-Fa-f]{6}$/.test(hex)) {
            console.error('קוד צבע HEX לא תקין:', hex);
            return '';
        }
        
        // המרה למספרים
        const r = parseInt(hex.substring(0, 2), 16);
        const g = parseInt(hex.substring(2, 4), 16);
        const b = parseInt(hex.substring(4, 6), 16);
        
        // החזרת מחרוזת RGBA
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    } catch (error) {
        console.error('שגיאה בהמרת צבע:', error);
        return '';
    }
}

function updateTable(events) {
    const tbody = document.getElementById('eventsTable');
    let newContent = '';
    
    if (events.length === 0) {
        newContent = '<tr><td colspan="6" class="text-center">לא נמצאו תוצאות</td></tr>';
    } else {
        events.forEach(event => {
            console.log('מעבד אירוע:', event.title, 'צבע:', event.color);
            const color = event.color ? convertToRGBA(event.color) : '';
            console.log('צבע אחרי המרה:', color);
            
            newContent += `
                <tr id="row-${event.id}">
                    <td>
                        ${event.color ? 
                            `<span style="background-color: ${color}; padding: 4px 8px; border-radius: 4px;">
                                ${event.title}
                            </span>` : 
                            event.title
                        }
                    </td>
                    <td>${event.gregorian_date}</td>
                    <td>${event.hebrew_date}</td>
                    <td>${event.time || ''}</td>
                    <td>${event.description || ''}</td>
                    <td>
                        <div class="btn-group" role="group">
                            <button class="btn btn-outline-primary btn-sm" onclick="editEvent(${event.id})" title="ערוך אירוע">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil" viewBox="0 0 16 16">
                                    <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/>
                                </svg>
                            </button>
                            <button class="btn btn-outline-danger btn-sm" onclick="deleteEvent(${event.id})" title="מחק אירוע">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
                                    <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
                                    <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
                <tr id="edit-form-${event.id}" class="edit-form-row" style="display: none;">
                    <td colspan="6">
                        <div class="edit-event-form p-3">
                            <form class="event-edit-form" data-event-id="${event.id}">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="title-${event.id}" class="form-label">כותרת</label>
                                        <input type="text" class="form-control" id="title-${event.id}" value="${event.title}" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="gregorian_date-${event.id}" class="form-label">תאריך לועזי</label>
                                        <input type="date" class="form-control" id="gregorian_date-${event.id}" 
                                            value="${event.gregorian_date}" onchange="updateHebrewDate(${event.id})" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="hebrew_date-${event.id}" class="form-label">תאריך עברי</label>
                                        <input type="text" class="form-control" id="hebrew_date-${event.id}" 
                                            value="${event.hebrew_date}" readonly>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="time-${event.id}" class="form-label">שעה</label>
                                        <input type="time" class="form-control" id="time-${event.id}" 
                                            value="${event.time || ''}">
                                    </div>
                                    <div class="col-12 mb-3">
                                        <label for="description-${event.id}" class="form-label">תיאור</label>
                                        <textarea class="form-control" id="description-${event.id}">${event.description || ''}</textarea>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="end_date-${event.id}" class="form-label">תאריך סיום</label>
                                        <input type="date" class="form-control" id="end_date-${event.id}" 
                                            value="${event.end_date || ''}">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="color-${event.id}" class="form-label">צבע</label>
                                        <select class="form-control" id="color-${event.id}">
                                            <option value="">ללא צבע</option>
                                            <option value="cyan" ${event.color === 'cyan' ? 'selected' : ''}>ציאן</option>
                                            <option value="yellow" ${event.color === 'yellow' ? 'selected' : ''}>צהוב</option>
                                            <option value="orange" ${event.color === 'orange' ? 'selected' : ''}>כתום</option>
                                            <option value="green" ${event.color === 'green' ? 'selected' : ''}>ירוק</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="text-end">
                                    <button type="button" class="btn btn-secondary" onclick="cancelEdit(${event.id})">ביטול</button>
                                    <button type="submit" class="btn btn-primary">שמור שינויים</button>
                                </div>
                            </form>
                        </div>
                    </td>
                </tr>
            `;
        });
    }
    
    tbody.innerHTML = newContent;

    // הוספת מאזינים לטפסים
    document.querySelectorAll('.event-edit-form').forEach(form => {
        console.log('מוסיף מאזין לטופס:', form);
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            console.log('!!! טופס נשלח !!!');
            const eventId = parseInt(this.dataset.eventId);
            console.log('מזהה אירוע:', eventId);
            
            console.log('=== תחילת שמירת אירוע ===');
            const searchInput = document.getElementById('searchInput');
            console.log('ערך נוכחי בשדה החיפוש:', searchInput.value);
            
            const eventData = {
                title: document.getElementById(`title-${eventId}`).value,
                gregorian_date: document.getElementById(`gregorian_date-${eventId}`).value,
                hebrew_date: document.getElementById(`hebrew_date-${eventId}`).value,
                time: document.getElementById(`time-${eventId}`).value || null,
                description: document.getElementById(`description-${eventId}`).value || '',
                end_date: document.getElementById(`end_date-${eventId}`).value || null,
                color: document.getElementById(`color-${eventId}`).value || null
            };
            console.log('נתוני האירוע לשליחה:', eventData);

            try {
                console.log('שולח בקשת עדכון לשרת...');
                const response = await fetch(`/api/events/${eventId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(eventData)
                });
                
                console.log('תשובה מהשרת:', response.status);
                const result = await response.json();
                console.log('תוצאת העדכון:', result);
                
                if (result.success) {
                    console.log('העדכון הצליח!');
                    
                    try {
                        // ניקוי שדה החיפוש
                        console.log('מנקה שדה חיפוש...');
                        searchInput.value = '';
                        console.log('ערך שדה החיפוש אחרי ניקוי:', searchInput.value);
                        
                        // טעינה מחדש של כל האירועים
                        console.log('טוען את כל האירועים מחדש...');
                        await loadAllEvents();
                        console.log('טעינת האירועים הושלמה');
                        
                        // הסתרת טופס העריכה
                        const formRow = document.getElementById(`edit-form-${eventId}`);
                        formRow.style.display = 'none';
                        
                        showMessage('האירוע עודכן בהצלחה');
                        console.log('=== סיום שמית אירוע בהצלחה ===');
                    } catch (error) {
                        console.error('שגיאה בטעינת האירועים:', error);
                    }
                } else {
                    console.error('שגיאה בעדכון:', result);
                    alert('שגיאה בעדכון האירוע');
                }
            } catch (error) {
                console.error('Error updating event:', error);
                alert('שגיאה בעדכון האירוע');
            }
            
            return false;
        });
    });
}

function editEvent(eventId) {
    // הסתרת כל הטפסים הפתוחים
    document.querySelectorAll('.edit-form-row').forEach(row => {
        row.style.display = 'none';
    });
    
    // הצגת הטופס הנבחר
    const formRow = document.getElementById(`edit-form-${eventId}`);
    formRow.style.display = 'table-row';
}

function cancelEdit(eventId) {
    const formRow = document.getElementById(`edit-form-${eventId}`);
    formRow.style.display = 'none';
}

async function updateHebrewDate(eventId) {
    const gregorianDate = document.getElementById(`gregorian_date-${eventId}`).value;
    try {
        const response = await fetch(`/api/hebrew-date/${gregorianDate}`);
        const data = await response.json();
        document.getElementById(`hebrew_date-${eventId}`).value = data.hebrew_date;
    } catch (error) {
        console.error('Error converting date:', error);
    }
}

function deleteEvent(eventId) {
    if (confirm('האם אתה בטוח שברצונך למחוק אירוע זה?')) {
        fetch(`/api/events/${eventId}`, {
            method: 'DELETE'
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                loadEvents();  // טעינה מחדש של הטבה במקום רענון הדף
            } else {
                alert('גיאה במחיקת האירוע');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('שגיאה במחיקת האירוע');
        });
    }
}

// פונקציה לניקוי החיפוש וטעינת כל האירועים
function clearSearchAndLoadAll() {
    console.log('=== מנסה לנקות את שדה החיפוש ===');
    const searchInput = document.getElementById('searchInput');
    console.log('ערך שדה החיפוש לפני ניקוי:', searchInput.value);
    searchInput.value = '';
    console.log('ערך שדה החיפוש אחרי ניקוי:', searchInput.value);
    loadEvents();
}

// פונקציה חדשה לטעינת כל האירועים
async function loadAllEvents() {
    console.log('=== מתחיל טעינת כל האירועים (loadAllEvents) ===');
    try {
        const response = await fetch('/api/events');
        console.log('קוד תשובה מהשרת:', response.status);
        const events = await response.json();
        console.log('התקבלו', events.length, 'אירועים');
        updateTable(events);
        
        // ניקוי התגיות כשחוזרים לרשימה המלאה
        const activeFilters = document.querySelector('.active-filters');
        activeFilters.style.display = 'none';
        document.querySelector('.filter-chips').innerHTML = '';
        
    } catch (error) {

async function performAdvancedSearch() {
    const searchParams = {
        title: document.getElementById('titleSearch').value,
        description: document.getElementById('descriptionSearch').value,
        startDate: document.getElementById('startDate').value,
        endDate: document.getElementById('endDate').value,
        timeFilter: document.querySelector('input[name="timeFilter"]:checked').value,
        color: document.getElementById('colorSearch').value
    };
    
    try {
        const queryString = new URLSearchParams({
            advanced_search: JSON.stringify(searchParams)
        }).toString();
        
        const response = await fetch(`/api/events/advanced-search?${queryString}`);
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const events = await response.json();
        updateTable(events);
        updateFilterChips(searchParams);  // עדכון התגיות
        
        // סגירת פאנל החיפוש המתקדם
        const panel = document.getElementById('advancedSearchPanel');
        panel.classList.remove('show');
        setTimeout(() => panel.style.display = 'none', 300);
        
    } catch (error) {
        console.error('שגיאה בחיפוש מתקדם:', error);
        const tbody = document.getElementById('eventsTable');
        tbody.innerHTML = '<tr><td colspan="6" class="text-center">שגיאה בחיפוש</td></tr>';
    }
}

function updateFilterChips(searchParams) {
    const filterChips = document.querySelector('.filter-chips');
    const activeFilters = document.querySelector('.active-filters');
    let hasActiveFilters = false;
    let chipsHtml = '';
    
    // יילון תרגום צבעים
    const colorTranslations = {
        'cyan': 'ציאן',
        'yellow': 'צהוב',
        'orange': 'כתום',
        'green': 'ירוק',
        'null': 'ללא צבע'
    };
    
    // יצירת צ'יפים לפי הפרמטרים
    if (searchParams.title) {
        hasActiveFilters = true;
        chipsHtml += `
            <div class="filter-chip" data-filter="title">
                שם: ${searchParams.title}
                <span class="remove-filter" onclick="removeFilter('title')">
                    <i class="bi bi-x"></i>
                </span>
            </div>`;
    }
    
    if (searchParams.description) {
        hasActiveFilters = true;
        chipsHtml += `
            <div class="filter-chip" data-filter="description">
                תיאור: ${searchParams.description}
                <span class="remove-filter" onclick="removeFilter('description')">
                    <i class="bi bi-x"></i>
                </span>
            </div>`;
    }
    
    if (searchParams.startDate || searchParams.endDate) {
        hasActiveFilters = true;
        let dateText = '';
        if (searchParams.startDate && searchParams.endDate) {
            dateText = `${searchParams.startDate} - ${searchParams.endDate}`;
        } else if (searchParams.startDate) {
            dateText = `מ-${searchParams.startDate}`;
        } else {
            dateText = `עד-${searchParams.endDate}`;
        }
        chipsHtml += `
            <div class="filter-chip" data-filter="date">
                תאריך: ${dateText}
                <span class="remove-filter" onclick="removeFilter('date')">
                    <i class="bi bi-x"></i>
                </span>
            </div>`;
    }
    
    if (searchParams.timeFilter && searchParams.timeFilter !== 'all') {
        hasActiveFilters = true;
        const timeFilterText = searchParams.timeFilter === 'past' ? 'אירועים שעברו' : 'אירועים עתידיים';
        chipsHtml += `
            <div class="filter-chip" data-filter="timeFilter">
                ${timeFilterText}
                <span class="remove-filter" onclick="removeFilter('timeFilter')">
                    <i class="bi bi-x"></i>
                </span>
            </div>`;
    }
    
    if (searchParams.color) {
        hasActiveFilters = true;
        const colorText = colorTranslations[searchParams.color] || searchParams.color;
        chipsHtml += `
            <div class="filter-chip" data-filter="color">
                צבע: ${colorText}
                <span class="remove-filter" onclick="removeFilter('color')">
                    <i class="bi bi-x"></i>
                </span>
            </div>`;
    }
    
    // הוספת כפתור עריכה אם יש פילטרים פעילים
    if (hasActiveFilters) {
        chipsHtml += `
            <span class="edit-search" onclick="editAdvancedSearch(event)">
                <i class="bi bi-pencil"></i>
                ערוך חיפוש
            </span>`;
        activeFilters.style.display = 'block';
    } else {
        activeFilters.style.display = 'none';
    }
    
    filterChips.innerHTML = chipsHtml;
}

// פונקציה להסרת פילטר בודד
async function removeFilter(filterType) {
    const form = document.getElementById('advancedSearchForm');
    
    switch(filterType) {
        case 'title':
            document.getElementById('titleSearch').value = '';
            break;
        case 'description':
            document.getElementById('descriptionSearch').value = '';
            break;
        case 'date':
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            break;
        case 'timeFilter':
            document.querySelector('input[name="timeFilter"][value="all"]').checked = true;
            break;
        case 'color':
            document.getElementById('colorSearch').value = '';
            break;
    }
    
    await performAdvancedSearch();
}

// פונקציה לפתיחת החיפוש המתקדם לעריכה
function editAdvancedSearch(e) {
    if (e) {
        e.stopPropagation();  // מניעת התפשטות האירוע
    }
    const panel = document.getElementById('advancedSearchPanel');
    panel.style.display = 'block';
    setTimeout(() => panel.classList.add('show'), 10);
}
</script>
