<!-- מודל הוספה/עריכה משותף ללוח ולניהול אירועים -->
<div class="modal fade" id="quickEventModal" tabindex="-1" aria-labelledby="quickEventModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="quickEventModalLabel">אירוע חדש</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="סגור"></button>
            </div>
            <form id="quickEventForm">
                <input type="hidden" id="quick_event_id" value="">
                <input type="hidden" id="quick_color" value="">
                <div class="modal-body">
                    <div class="mb-2">
                        <label for="quick_title" class="form-label">כותרת</label>
                        <input type="text" class="form-control" id="quick_title" required autofocus>
                        <div class="quick-color-picker mt-2" role="radiogroup" aria-label="צבע האירוע">
                            <button type="button" class="quick-color-swatch is-none is-selected" data-color="" title="ללא צבע" aria-label="ללא צבע"></button>
                        </div>
                    </div>
                    <div class="quick-when">
                        <div class="quick-field quick-field-date">
                            <label for="quick_gregorian_date" class="form-label">תאריך</label>
                            <input type="date" class="form-control" id="quick_gregorian_date" dir="ltr" required>
                        </div>
                        <div class="quick-field quick-field-time">
                            <label for="quick_time" class="form-label">שעה</label>
                            <input type="time" class="form-control" id="quick_time" dir="ltr" step="60">
                        </div>
                        <div class="quick-field quick-field-hebrew">
                            <label for="quick_hebrew_date" class="form-label">תאריך עברי</label>
                            <input type="text" class="form-control" id="quick_hebrew_date" readonly required>
                        </div>
                    </div>
                    <div class="quick-end-wrap">
                        <button type="button" class="quick-end-toggle" id="quick_end_toggle" aria-expanded="false" aria-controls="quick_end_date">+ תאריך סיום</button>
                        <div class="quick-end-field">
                            <label for="quick_end_date" class="form-label">תאריך סיום</label>
                            <input type="date" class="form-control" id="quick_end_date" dir="ltr">
                        </div>
                    </div>
                    <div class="quick-recurrence" id="quick_recurrence">
                        <div class="quick-recurrence-line">
                            <label class="form-label" for="quick_recurrence_freq">חזרה</label>
                            <select id="quick_recurrence_freq" class="form-select form-select-sm">
                                <option value="">ללא</option>
                                <option value="monthly">כל חודש</option>
                                <option value="yearly">כל שנה</option>
                            </select>
                            <select id="quick_recurrence_calendar" class="form-select form-select-sm" hidden>
                                <option value="gregorian">לועזי</option>
                                <option value="hebrew">עברי</option>
                            </select>
                        </div>
                        <div class="quick-recurrence-line" id="quick_recurrence_end_row" hidden>
                            <label class="form-label" for="quick_recurrence_end_mode">סיום</label>
                            <select id="quick_recurrence_end_mode" class="form-select form-select-sm">
                                <option value="never">בלי סוף</option>
                                <option value="until">עד תאריך</option>
                                <option value="count">מספר פעמים</option>
                            </select>
                            <input type="date" id="quick_recurrence_until" class="form-control form-control-sm" dir="ltr" hidden aria-label="חזרה עד תאריך">
                            <input type="number" id="quick_recurrence_count" class="form-control form-control-sm" dir="ltr" min="1" max="2400" hidden inputmode="numeric" placeholder="פעמים" aria-label="מספר פעמים">
                        </div>
                        <div class="quick-recurrence-scope" id="quick_recurrence_scope" hidden role="radiogroup" aria-label="היקף העריכה">
                            <label class="quick-scope-option">
                                <input type="radio" name="quick_recurrence_scope" value="occurrence" checked>
                                <span>רק הפעם</span>
                            </label>
                            <label class="quick-scope-option">
                                <input type="radio" name="quick_recurrence_scope" value="all">
                                <span>כל הסדרה</span>
                            </label>
                        </div>
                    </div>
                    <div class="quick-shift" id="quickShiftBlock" hidden>
                        <label class="quick-reminder-check" for="quick_shift_enabled">
                            <input type="checkbox" id="quick_shift_enabled">
                            <span>משמרת</span>
                        </label>
                        <div id="quick_shift_panel" class="quick-shift-panel" hidden>
                            <select id="quick_shift_person" class="form-select form-select-sm" aria-label="אדם"></select>
                            <input type="text" class="form-control form-control-sm" id="quick_shift_label" maxlength="80" placeholder="יום מחלה, יום חופש…" aria-label="תיאור המשמרת" autocomplete="off">
                            <div id="quick_shift_picks" class="quick-shift-picks" role="group" aria-label="הצעות">
                                <button type="button" class="quick-shift-pick" data-shift-pick="בוקר">בוקר</button>
                                <button type="button" class="quick-shift-pick" data-shift-pick="ערב">ערב</button>
                                <button type="button" class="quick-shift-pick" data-shift-pick="לילה">לילה</button>
                            </div>
                            <p class="quick-shift-note">הכותרת היא מה שכתוב כאן. הצבע לפי האדם.</p>
                        </div>
                    </div>
                    <div class="mb-0">
                        <label for="quick_description" class="form-label">תיאור</label>
                        <textarea class="form-control" id="quick_description" rows="2"></textarea>
                    </div>
                    <div class="quick-reminder-wrap">
                        <label class="quick-reminder-check" for="quick_reminder_enabled">
                            <input type="checkbox" id="quick_reminder_enabled">
                            <span>תזכורת</span>
                        </label>
                        <div id="quick_reminder_panel" class="quick-reminder-panel" hidden>
                            <div id="quick_reminder_offsets" class="reminder-offset-grid" role="group" aria-label="מתי להזכיר"></div>
                            <div class="reminder-custom">
                                <button type="button" class="quick-reminder-custom-toggle" id="quick_reminder_custom_toggle" aria-expanded="false" aria-controls="quick_reminder_custom_row">אחר</button>
                                <div id="quick_reminder_custom_row" class="reminder-custom-row" hidden>
                                    <input type="number" class="form-control" id="quick_reminder_custom_amount" min="1" step="1" inputmode="numeric" dir="ltr" aria-label="כמות">
                                    <select class="form-select" id="quick_reminder_custom_unit" aria-label="יחידה">
                                        <option value="minutes">דקות</option>
                                        <option value="hours">שעות</option>
                                        <option value="days">ימים</option>
                                    </select>
                                    <button type="button" class="btn btn-outline-primary btn-sm" id="quick_reminder_custom_add">הוסף</button>
                                </div>
                                <div id="quick_reminder_custom_list" class="reminder-offset-grid"></div>
                            </div>
                            <p id="quick_reminder_error" class="reminder-form-error" hidden></p>
                            <div class="reminder-recipients">
                                <div class="form-label">למי להזכיר</div>
                                <div id="quick_reminder_recipients"></div>
                                <a class="reminder-people-link" href="/settings" target="_blank" rel="noopener">תזכורות</a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">ביטול</button>
                    <button type="submit" class="btn btn-primary" id="quick_submit_btn">הוסף אירוע</button>
                </div>
            </form>
        </div>
    </div>
</div>
