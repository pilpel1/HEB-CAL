<div class="modal fade" id="shiftEntryModal" tabindex="-1" aria-labelledby="shiftEntryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="shiftEntryModalLabel">משמרות</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="סגור"></button>
            </div>
            <div class="modal-body">
                <div class="shift-person-row mb-2">
                    <span id="shiftPersonDot" class="shift-color-dot" hidden></span>
                    <div class="shift-person-field">
                        <label for="shiftPersonSelect" class="form-label">אדם</label>
                        <select id="shiftPersonSelect" class="form-select"></select>
                    </div>
                </div>
                <div class="shift-week-nav">
                    <button type="button" class="btn btn-outline-secondary" id="shiftWeekPrev" aria-label="שבוע קודם">הקודם</button>
                    <div id="shiftWeekLabel" class="shift-week-label"></div>
                    <button type="button" class="btn btn-outline-secondary" id="shiftWeekNext" aria-label="שבוע הבא">הבא</button>
                </div>
                <div id="shiftGrid"></div>
                <p id="shiftEntryEmpty" class="text-muted mb-0" hidden>
                    אין אנשים.
                    <a href="/settings">מוסיפים בהגדרות</a>
                    ואז חוזרים לכאן.
                </p>
                <p id="shiftEntryError" class="reminder-form-error mt-2" hidden></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ביטול</button>
                <button type="button" class="btn btn-primary" id="shiftEntrySave">שמירה</button>
            </div>
        </div>
    </div>
</div>
