{% extends "base.html" %}

{% block title %}הוספת אירוע{% endblock %}

{% block content %}
<style>
    .form-control {
        border: 1px solid #ced4da !important;
    }
    .form-control:focus {
        border-color: #80bdff !important;
        box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25) !important;
    }
    textarea.form-control {
        height: auto !important;
    }
    .input-wrapper {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        height: 100%;
    }
    .form-label {
        margin-bottom: 8px;
    }
</style>
<div class="card">
    <div class="card-header">
        <a href="/" class="text-decoration-none d-inline-block mb-2">&rarr; חזרה ללוח</a>
        <h5 class="card-title mb-0">הוספת אירוע חדש</h5>
    </div>
    <div class="card-body">
        <form id="eventForm">
            <div class="mb-3">
                <label for="title" class="form-label">כותרת</label>
                <input type="text" class="form-control" id="title" required>
            </div>
            <div class="row align-items-end">
                <div class="col mb-3">
                    <div class="input-wrapper">
                        <label for="gregorian_date" class="form-label">תאריך לועזי</label>
                        <input type="date" class="form-control" id="gregorian_date" required>
                    </div>
                </div>
                <div class="col mb-3">
                    <div class="input-wrapper">
                        <label for="hebrew_date" class="form-label">תאריך עברי</label>
                        <input type="text" class="form-control" id="hebrew_date" required>
                    </div>
                </div>
                <div class="col mb-3">
                    <div class="input-wrapper">
                        <label for="time" class="form-label">שעה</label>
                        <input type="time" class="form-control" id="time">
                    </div>
                </div>
                <div class="col mb-3">
                    <div class="input-wrapper">
                        <label for="end_date" class="form-label">תאריך סיום (אופציונלי)</label>
                        <input type="date" id="end_date" name="end_date" class="form-control">
                    </div>
                </div>
                <div class="col mb-3">
                    <div class="input-wrapper">
                        <label for="color" class="form-label">צבע האירוע</label>
                        <select id="color" name="color" class="form-control">
                            <option value="">ללא צבע</option>
                            <option value="cyan">ציאן</option>
                            <option value="yellow">צהוב</option>
                            <option value="orange">כתום</option>
                            <option value="green">ירוק</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">תיאור</label>
                <textarea class="form-control" id="description" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">הוסף אירוע</button>
        </form>
    </div>
</div>
{% endblock %}
