{% extends "base.html" %}

{% block title %}לוח שנה{% endblock %}

{% block extra_css %}
<style>
    .date-container {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 60px;
    }
    
    .gregorian-date {
        position: absolute;
        top: 5px;
        left: 5px;
        font-size: 0.8em;
        color: #666;
    }
    
    .hebrew-date {
        position: absolute;
        top: 5px;
        right: 5px;
        font-size: 0.8em;
        direction: rtl;
    }
    
    td {
        position: relative;
        width: 14.28%;
        padding: 10px;
        border: 1px solid #ddd;
        background-color: white;
    }

    .current-day {
        background-color: #e8f5e9 !important;
    }
</style>
{% endblock %}

{% block content %}
<h1 class="mb-4">לוח שנה</h1>

<!-- לוח השנה -->
<div class="calendar-container">
    <div class="calendar-header">
        <h2 id="current-month"></h2>
        <div class="calendar-nav">
            <button class="btn btn-outline-primary" onclick="previousMonth()">חודש קודם</button>
            <button class="btn btn-outline-primary" onclick="goToToday()">היום</button>
            <button class="btn btn-outline-primary" onclick="nextMonth()">חודש הבא</button>
        </div>
    </div>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ראשון</th>
                <th>שני</th>
                <th>שלישי</th>
                <th>רביעי</th>
                <th>חמישי</th>
                <th>שישי</th>
                <th>שבת</th>
            </tr>
        </thead>
        <tbody id="calendar-body">
            <!-- דוגמה לתא בלוח השנה -->
            <tr>
                <td>
                    <div class="date-container">
                        <span class="gregorian-date">1</span>
                        <span class="hebrew-date">א' תשרי</span>
                        <div class="day-content">
                            <!-- האירועים יוכנסו כאן דרך JavaScript -->
                        </div>
                    </div>
                </td>
                <!-- ... -->
            </tr>
        </tbody>
    </table>
</div>
{% endblock %}
