{% extends "base.html" %}

{% block title %}לוח שנה{% endblock %}

{% block content %}
<!-- לוח שנה אינסופי — גלילה רציפה עם טעינה הדרגתית -->
<div class="calendar-container infinite-calendar is-booting">
    <div class="calendar-toolbar" id="calendar-toolbar">
        <h2 id="current-month" class="toolbar-month-label" aria-live="polite"></h2>
        <div class="toolbar-actions" id="toolbar-actions">
            <div class="calendar-nav" id="calendar-nav">
                <button type="button" class="btn btn-outline-primary btn-today" id="goToTodayBtn" onclick="goToToday()" title="היום" aria-label="היום">היום</button>
                <div class="dropdown">
                    <button class="btn btn-outline-primary" type="button" id="jumpToDateBtn" data-bs-toggle="dropdown" aria-expanded="false" title="דלג לתאריך" aria-label="דלג לתאריך">
                        <i class="fa-solid fa-calendar-days" aria-hidden="true"></i>
                    </button>
                    <div class="dropdown-menu p-3" aria-labelledby="jumpToDateBtn">
                        <div class="mb-2">
                            <select class="form-select" id="monthSelect">
                                <option value="0">ינואר</option>
                                <option value="1">פברואר</option>
                                <option value="2">מרץ</option>
                                <option value="3">אפריל</option>
                                <option value="4">מאי</option>
                                <option value="5">יוני</option>
                                <option value="6">יולי</option>
                                <option value="7">אוגוסט</option>
                                <option value="8">ספטמבר</option>
                                <option value="9">אוקטובר</option>
                                <option value="10">נובמבר</option>
                                <option value="11">דצמבר</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <select class="form-select" id="yearSelect">
                                <!-- יתמלא דינמית ע"י JavaScript -->
                            </select>
                        </div>
                        <button class="btn btn-primary w-100" onclick="jumpToDate()">אישור</button>
                    </div>
                </div>
                <button type="button" class="btn btn-primary" id="addEventFromCalendarBtn" title="הוסף אירוע" aria-label="הוסף אירוע">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i>
                </button>
                <button type="button" class="btn btn-outline-primary" id="enterShiftsBtn" hidden title="משמרות" aria-label="משמרות">
                    <svg class="shift-grid-icon" viewBox="0 0 18 28" width="14" height="20" aria-hidden="true" focusable="false">
                        <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
                            <rect x="0.8" y="0.8" width="6.4" height="6.4" rx="1.2"/>
                            <rect x="10.8" y="0.8" width="6.4" height="6.4" rx="1.2"/>
                            <rect x="0.8" y="10.8" width="6.4" height="6.4" rx="1.2"/>
                            <rect x="10.8" y="10.8" width="6.4" height="6.4" rx="1.2"/>
                            <rect x="0.8" y="20.8" width="6.4" height="6.4" rx="1.2"/>
                            <rect x="10.8" y="20.8" width="6.4" height="6.4" rx="1.2"/>
                        </g>
                        <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2.2 4.2 3.6 5.6 5.9 2.7"/>
                            <path d="M2.2 14.2 3.6 15.6 5.9 12.7"/>
                            <path d="M12.2 14.2 13.6 15.6 15.9 12.7"/>
                            <path d="M12.2 24.2 13.6 25.6 15.9 22.7"/>
                        </g>
                    </svg>
                </button>
                <a href="/events_list" class="btn btn-outline-secondary" id="calendarEventsLink" title="רשימת אירועים" aria-label="רשימת אירועים">
                    <i class="fa-solid fa-list" aria-hidden="true"></i>
                </a>
                <a href="/settings#settingsUpdate" class="btn btn-outline-secondary settings-gear-btn" title="הגדרות" aria-label="הגדרות">
                    <i class="fa-solid fa-gear" aria-hidden="true"></i>
                    <span class="update-nav-badge" id="updateNavBadge" hidden></span>
                </a>
            </div>
        </div>
        <button type="button" class="header-collapse" id="header-collapse" aria-expanded="true" aria-controls="toolbar-actions" aria-label="הסתר פעולות">
            <span class="header-collapse-chevron" aria-hidden="true">
                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M3.2 10.2 8 5.4l4.8 4.8-1.1 1.1L8 7.6 4.3 11.3z"/>
                </svg>
            </span>
        </button>
    </div>
    <script>
        (function () {
            try {
                if (localStorage.getItem('heb-cal-header-collapsed') === '1'
                    && window.matchMedia('(max-width: 480px)').matches) {
                    var bar = document.getElementById('calendar-toolbar');
                    var toggle = document.getElementById('header-collapse');
                    if (bar) bar.classList.add('is-collapsed');
                    if (toggle) {
                        toggle.setAttribute('aria-expanded', 'false');
                        toggle.setAttribute('aria-label', 'הצג פעולות');
                    }
                }
            } catch (e) {}
        })();
    </script>

    <div class="calendar-stream-frame">
        <div id="calendar-stream" class="calendar-stream" tabindex="-1" aria-busy="true">
            <div class="weekday-header" aria-hidden="true">
                <div><span class="wd-full">ראשון</span><span class="wd-short">א׳</span></div>
                <div><span class="wd-full">שני</span><span class="wd-short">ב׳</span></div>
                <div><span class="wd-full">שלישי</span><span class="wd-short">ג׳</span></div>
                <div><span class="wd-full">רביעי</span><span class="wd-short">ד׳</span></div>
                <div><span class="wd-full">חמישי</span><span class="wd-short">ה׳</span></div>
                <div><span class="wd-full">שישי</span><span class="wd-short">ו׳</span></div>
                <div><span class="wd-full">שבת</span><span class="wd-short">ש׳</span></div>
            </div>
            <table class="table table-bordered calendar-table continuous-calendar">
                <tbody id="calendar-weeks">
                    <!-- שבועות רציפים נטענים לכאן -->
                </tbody>
            </table>
        </div>
        <div id="calendar-boot-status" class="calendar-boot-status" aria-live="polite">טוען לוח…</div>
        <button type="button" id="day-agenda-toggle" class="day-agenda-toggle" aria-expanded="true" aria-controls="day-agenda" aria-label="הסתר אירועי היום">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
                <path fill="currentColor" d="M3.2 10.2 8 5.4l4.8 4.8-1.1 1.1L8 7.6 4.3 11.3z"/>
            </svg>
        </button>
    </div>
    <div id="agenda-resize" class="agenda-resize" role="separator" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20" aria-valuetext="20 אחוז לפאנל" aria-label="שינוי גודל הפאנל" aria-controls="day-agenda" tabindex="0">
        <span class="agenda-resize-grip" aria-hidden="true"></span>
        <button type="button" id="agenda-resize-restore" class="agenda-resize-restore" tabindex="-1" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
                <path fill="currentColor" d="M3.2 10.2 8 5.4l4.8 4.8-1.1 1.1L8 7.6 4.3 11.3z"/>
            </svg>
        </button>
    </div>
    <section id="day-agenda" class="day-agenda" aria-label="אירועי היום הנבחר">
        <div class="day-agenda-head">
            <h3 id="day-agenda-title" class="day-agenda-title"><span id="day-agenda-heb" class="day-agenda-heb"></span><span class="day-agenda-sep" aria-hidden="true"> · </span><span id="day-agenda-greg" class="day-agenda-greg"></span></h3>
            <button type="button" class="btn btn-outline-primary btn-sm" id="day-agenda-add" title="הוסף אירוע" aria-label="הוסף אירוע"><i class="fa-solid fa-plus day-agenda-add-icon" aria-hidden="true"></i><span class="day-agenda-add-label">הוסף</span></button>
        </div>
        <ul id="day-agenda-list" class="day-agenda-list"></ul>
    </section>
</div>
<script>
    (function () {
        try {
            if (localStorage.getItem('heb-cal-agenda-collapsed') !== '1') return;
            if (!window.matchMedia('(min-width: 992px)').matches) return;
            var cal = document.querySelector('.infinite-calendar');
            var toggle = document.getElementById('day-agenda-toggle');
            var agenda = document.getElementById('day-agenda');
            if (cal) cal.classList.add('is-agenda-collapsed');
            if (toggle) {
                toggle.setAttribute('aria-expanded', 'false');
                toggle.setAttribute('aria-label', 'הצג אירועי היום');
            }
            if (agenda) {
                agenda.setAttribute('aria-hidden', 'true');
                agenda.setAttribute('inert', '');
            }
        } catch (e) {}
    })();
</script>

{% include 'partials/quick_event_modal.html' %}
{% include 'partials/shift_entry_modal.html' %}

<script>
document.addEventListener('DOMContentLoaded', function() {
    const yearSelect = document.getElementById('yearSelect');
    const currentYear = new Date().getFullYear();

    for (let year = 1900; year <= currentYear + 20; year++) {
        const option = document.createElement('option');
        option.value = year;
        option.textContent = year;
        if (year === currentYear) {
            option.selected = true;
        }
        yearSelect.appendChild(option);
    }

    document.getElementById('monthSelect').value = new Date().getMonth();
});

function jumpToDate() {
    const selectedMonth = parseInt(document.getElementById('monthSelect').value, 10);
    const selectedYear = parseInt(document.getElementById('yearSelect').value, 10);

    if (typeof jumpToMonth === 'function') {
        jumpToMonth(selectedYear, selectedMonth + 1);
    }

    const dropdown = bootstrap.Dropdown.getInstance(document.getElementById('jumpToDateBtn'));
    if (dropdown) {
        dropdown.hide();
    }
}
</script>
{% endblock %}
