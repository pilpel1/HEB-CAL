{% extends "base.html" %}

{% block title %}לוח שנה{% endblock %}

{% block content %}
<h1 class="mb-4">לוח שנה</h1>

<!-- לוח השנה -->
<div class="calendar-container">
    <div class="calendar-header">
        <h2 id="current-month"></h2>
        <div class="calendar-nav">
            <button class="btn btn-outline-primary" onclick="previousMonth()">חודש קודם</button>
            <button class="btn btn-outline-primary" onclick="goToToday()">היום</button>
            <button class="btn btn-outline-primary" onclick="nextMonth()">חודש הבא</button>
            <div class="dropdown d-inline-block">
                <button class="btn btn-outline-primary dropdown-toggle" type="button" id="jumpToDateBtn" data-bs-toggle="dropdown" aria-expanded="false">
                    דלג לתאריך...
                </button>
                <div class="dropdown-menu p-3" aria-labelledby="jumpToDateBtn">
                    <div class="mb-2">
                        <select class="form-select" id="monthSelect">
                            <option value="0">ינואר</option>
                            <option value="1">פברואר</option>
                            <option value="2">מרץ</option>
                            <option value="3">אפריל</option>
                            <option value="4">מאי</option>
                            <option value="5">יוני</option>
                            <option value="6">יולי</option>
                            <option value="7">אוגוסט</option>
                            <option value="8">ספטמבר</option>
                            <option value="9">אוקטובר</option>
                            <option value="10">נובמבר</option>
                            <option value="11">דצמבר</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <select class="form-select" id="yearSelect">
                            <!-- יתמלא דינמית ע"י JavaScript -->
                        </select>
                    </div>
                    <button class="btn btn-primary w-100" onclick="jumpToDate()">אישור</button>
                </div>
            </div>
        </div>
    </div>
    <table class="table table-bordered calendar-table">
        <thead>
            <tr>
                <th>ראשון</th>
                <th>שני</th>
                <th>שלישי</th>
                <th>רביעי</th>
                <th>חמישי</th>
                <th>שישי</th>
                <th>שבת</th>
            </tr>
        </thead>
        <tbody id="calendar-body">
            <!-- הנתונים יוכנסו כאן דרך JavaScript -->
        </tbody>
    </table>
</div>

<!-- מודל הוספה/עריכה מהירה מהלוח -->
<div class="modal fade" id="quickEventModal" tabindex="-1" aria-labelledby="quickEventModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="quickEventModalLabel">אירוע חדש</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="סגור"></button>
            </div>
            <form id="quickEventForm">
                <input type="hidden" id="quick_event_id" value="">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="quick_title" class="form-label">כותרת</label>
                        <input type="text" class="form-control" id="quick_title" required autofocus>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="quick_gregorian_date" class="form-label">תאריך לועזי</label>
                            <input type="date" class="form-control" id="quick_gregorian_date" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="quick_hebrew_date" class="form-label">תאריך עברי</label>
                            <input type="text" class="form-control" id="quick_hebrew_date" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="quick_time" class="form-label">שעה</label>
                            <input type="time" class="form-control" id="quick_time">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="quick_end_date" class="form-label">תאריך סיום</label>
                            <input type="date" class="form-control" id="quick_end_date">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="quick_color" class="form-label">צבע</label>
                        <select class="form-select" id="quick_color">
                            <option value="">ללא צבע</option>
                            <option value="cyan">ציאן</option>
                            <option value="yellow">צהוב</option>
                            <option value="orange">כתום</option>
                            <option value="green">ירוק</option>
                        </select>
                    </div>
                    <div class="mb-0">
                        <label for="quick_description" class="form-label">תיאור</label>
                        <textarea class="form-control" id="quick_description" rows="2"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">ביטול</button>
                    <button type="submit" class="btn btn-primary" id="quick_submit_btn">הוסף אירוע</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// פונקציה שתרוץ בטעינת העמוד
document.addEventListener('DOMContentLoaded', function() {
    // מילוי שנים בדרופדאון
    const yearSelect = document.getElementById('yearSelect');
    const currentYear = new Date().getFullYear();
    
    // הוספת שנים מ-1900 עד 20 שנה קדימה
    for (let year = 1900; year <= currentYear + 20; year++) {
        const option = document.createElement('option');
        option.value = year;
        option.textContent = year;
        if (year === currentYear) {
            option.selected = true;
        }
        yearSelect.appendChild(option);
    }
    
    // בחירת החודש הנוכחי בדרופדאון
    const currentMonth = new Date().getMonth();
    document.getElementById('monthSelect').value = currentMonth;
});

// פונקציה לקפיצה לתאריך שנבחר
function jumpToDate() {
    const selectedMonth = parseInt(document.getElementById('monthSelect').value);
    const selectedYear = parseInt(document.getElementById('yearSelect').value);
    
    // עדכון התאריך הנוכחי בלוח השנה
    currentDate = new Date(selectedYear, selectedMonth, 1);
    
    // עדכון הלוח
    updateCalendar();
    
    // סגירת הדרופדאון
    const dropdownMenu = document.querySelector('.dropdown-menu');
    const dropdown = bootstrap.Dropdown.getInstance(document.getElementById('jumpToDateBtn'));
    if (dropdown) {
        dropdown.hide();
    }
}
</script>
{% endblock %}
