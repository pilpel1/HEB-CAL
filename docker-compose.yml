# HEB-CAL. web + reminder עולים יחד.
# reminder שולח טלגרם (אם יש TELEGRAM_BOT_TOKEN) ומסנכרן יומן גוגל.
# פרופיל gcal הוא אותו סנכרון בלי טלגרם — לא להריץ אותו ליד reminder.
# בתוך הקונטיינר האפליקציה על 0.0.0.0:5000.
# על המארח ברירת המחדל היא 127.0.0.1, בלי פורט פתוח לרשת.
# Tailscale רץ על המארח. אין sidecar.
# Serve ליומן: אם 443 / תפוס, HTTPS 8443 על המארח. לא reset.

x-app: &app
  image: ${HEB_CAL_IMAGE:-ghcr.io/pilpel1/heb-cal:latest}
  build: .
  pull_policy: missing
  env_file:
    - path: .env
      required: false
  volumes:
    - ./data:/app/data
    - ./logs:/app/logs
    - ./backups:/app/backups
  # unless-stopped: אחרי אתחול Docker מחזיר קונטיינר שלא עצרו ידנית.
  # compose stop נשאר כבוי עד heb-cal.service (Linux) או המשימה HEB-CAL (Windows).
  restart: unless-stopped
  init: true

x-env: &runtime
  FLASK_DEBUG: "0"
  HEB_CAL_DOCKER: "1"
  HEB_CAL_UPDATE_MODE: docker
  TZ: ${REMINDER_TIMEZONE:-Asia/Jerusalem}

services:
  web:
    <<: *app
    ports:
      - "${HEB_CAL_BIND_HOST:-127.0.0.1}:${HEB_CAL_PORT:-5000}:5000"
    environment:
      <<: *runtime
      HEB_CAL_LOG_NAME: flask
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/updates/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  reminder:
    <<: *app
    environment:
      <<: *runtime
      HEB_CAL_LOG_NAME: worker
    command: ["python", "scripts/reminder_worker.py"]
    depends_on:
      web:
        condition: service_healthy

  gcal:
    <<: *app
    profiles: ["gcal"]
    environment:
      <<: *runtime
      HEB_CAL_LOG_NAME: gcal
    command: ["python", "scripts/gcal_sync_worker.py"]
    depends_on:
      web:
        condition: service_healthy
